# GoReleaser v2 config. CI runs `release --snapshot` on every PR as a
# dry-run; the release workflow runs `release --clean` on v* tags.
version: 2

project_name: atlas

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/atlas
    binary: atlas
    env:
      - CGO_ENABLED=0 # pure-Go static binary, see ADR-0004
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/orchestra-hq/atlas/internal/version.Version={{ .Version }}
      - -X github.com/orchestra-hq/atlas/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/orchestra-hq/atlas/internal/version.Date={{ .Date }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^ci:"

release:
  draft: true # publish manually after sanity-checking artifacts

# Cosign keyless signing (M4, docs/m4-build-plan.md). Signs checksums.txt using
# GitHub Actions OIDC — no key to manage — producing checksums.txt.{sig,pem}
# release assets. Signing OIDC is only available on the tagged release run (which
# grants id-token: write); the per-PR `release --snapshot` dry-run skips it
# (--skip=sign). install.sh and the documented manual path verify these.
signs:
  - cmd: cosign
    artifacts: checksum
    output: true
    args:
      - sign-blob
      - "--output-certificate=${certificate}"
      - "--output-signature=${signature}"
      - "${artifact}"
      - "--yes"
    certificate: "${artifact}.pem"

# Homebrew tap (M4). On a real release GoReleaser renders the formula and pushes
# it to the public orchestra-hq/homebrew-tap registry, authenticating with a
# short-lived token minted from the dedicated "Atlas Release" GitHub App (never a
# PAT; see release.yml). skip_upload: auto means snapshots/prereleases render the
# formula into dist/ without pushing — so the per-PR dry-run validates it offline.
brews:
  - name: atlas
    repository:
      owner: orchestra-hq
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    # Modern Homebrew only discovers formulae under Formula/ (or HomebrewFormula/);
    # a tap-root formula is not found. The default pushed to root, so pin it.
    directory: Formula
    homepage: "https://github.com/orchestra-hq/atlas"
    description: "Self-hosted LLM inference platform — Anthropic & OpenAI compatible APIs on your own hardware"
    license: "Apache-2.0"
    skip_upload: auto
    install: |
      bin.install "atlas"
    test: |
      system "#{bin}/atlas", "--version"
