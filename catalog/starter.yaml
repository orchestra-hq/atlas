# Atlas starter catalog — curated, agent-tested model definitions.
#
# Seeded from docs/research/model-catalog-m0.md and pinned at build time
# (build-time decision 5: explicit versions, explicit upgrades). GGUF entries
# carry the exact sha256 the store verifies against; Hugging Face (vLLM) entries
# name the repo the engine resolves at boot.
#
# The small llama.cpp tier boots from cold on a CPU box (and in CI) — that is
# the phase-9 exit criterion. The larger vLLM tiers need a GPU; their cold-boot
# conformance is the full-matrix tier, deferred with the rest of the vLLM GPU
# run (docs/open-questions.md), and lands in the phase-11 acceptance pass.

models:
  # --- Small, CPU-bootable (laptop / haiku) -------------------------------
  - name: qwen2.5-1.5b-instruct
    engine: llamacpp
    tier: haiku
    reasoning: false
    context_window: 32768
    source:
      type: gguf
      url: https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf
      sha256: 6a1a2eb6d15622bf3c96857206351ba97e1af16c30d7a74ee38970e434e9407e
      size: 1117320736
    sampling:
      temperature: 0.7
      top_p: 0.8

  - name: qwen3-0.6b
    engine: llamacpp
    tier: haiku
    reasoning: true
    context_window: 40960
    source:
      type: gguf
      url: https://huggingface.co/Qwen/Qwen3-0.6B-GGUF/resolve/main/Qwen3-0.6B-Q8_0.gguf
      sha256: 9465e63a22add5354d9bb4b99e90117043c7124007664907259bd16d043bb031
      size: 639446688
    sampling:
      temperature: 0.6
      top_p: 0.95

  # --- Capable non-reasoning gguf (GPU acceptance) ------------------------
  # Qwen2.5-7B-Instruct (non-reasoning) is the acceptance run's chat/sonnet
  # model: capable enough to drive the real Claude Code smoke (G9), yet genuinely
  # non-reasoning so it passes G4's "non-reasoning model ignores thinking
  # gracefully" assertion — which a hybrid (Qwen3) cannot. Paired with the
  # reasoning qwen3-8b-gguf below (opus alias) it gives the suite one model of
  # each profile, mirroring the per-PR tier. Single-file Q4_K_M (~4.7 GB).
  - name: qwen2.5-7b-instruct-gguf
    engine: llamacpp
    tier: sonnet
    reasoning: false
    context_window: 32768
    source:
      type: gguf
      url: https://huggingface.co/bartowski/Qwen2.5-7B-Instruct-GGUF/resolve/main/Qwen2.5-7B-Instruct-Q4_K_M.gguf
      sha256: 65b8fcd92af6b4fefa935c625d1ac27ea29dcb6ee14589c55a8f115ceaaa1423
      size: 4683074240
    sampling:
      temperature: 0.7
      top_p: 0.8

  # --- Capable reasoning gguf tier (GPU acceptance) -----------------------
  # Qwen3-8B Q4_K_M (hybrid-thinking) is the llama.cpp half of the GPU
  # acceptance run (docs/open-questions.md, scripts/acceptance.sh). Serving it
  # through the catalog (rather than a raw -hf spec) is deliberate: it threads
  # reasoning=true so enable_thinking is gated per request, the absence of which
  # made a raw-served hybrid leak <think> blocks into non-reasoning replies
  # (the documented raw-hybrid gap). ~5 GB; fits a 24 GB acceptance GPU.
  - name: qwen3-8b-gguf
    engine: llamacpp
    tier: sonnet
    reasoning: true
    context_window: 40960
    source:
      type: gguf
      url: https://huggingface.co/Qwen/Qwen3-8B-GGUF/resolve/main/Qwen3-8B-Q4_K_M.gguf
      sha256: d98cdcbd03e17ce47681435b5150e34c1417f50b5c0019dd560e4882c5745785
      size: 5027783488
    sampling:
      temperature: 0.6
      top_p: 0.95

  # --- Coder model (gemma4, thinking) -------------------------------------
  # Gemma-4-12B coder finetune (Apache-2.0), GGUF. A reasoning model — it thinks
  # in Gemma's native thought channel (enable_thinking handled by the chat
  # template), so reasoning=true. gemma4 arch is supported by the pinned
  # llama.cpp (b9611). Q4_K_M ~7.4 GB. Author-recommended sampling: temp 1.0 /
  # top_p 0.95. 256K context window per the model card.
  - name: gemma-4-12b-coder
    engine: llamacpp
    tier: sonnet
    reasoning: true
    context_window: 262144
    source:
      type: gguf
      url: https://huggingface.co/yuxinlu1/gemma-4-12B-coder-fable5-composer2.5-v1-GGUF/resolve/main/gemma4-coding-Q4_K_M.gguf
      sha256: 1fe90b72e105d7bc71650aa59883edece3e84751af489075217a7ae717b1fe8d
      size: 7381381664
    sampling:
      temperature: 1.0
      top_p: 0.95

  # --- Embedding models (M3 phase 2a, ADR-0012) ---------------------------
  # CPU-bootable on llama.cpp's embedding mode (--embedding), so /v1/embeddings
  # is provable on the per-PR tier alongside chat. Embedding models carry no tier
  # (they are addressed by name, not via the claude-* chat aliases).
  - name: nomic-embed-text-v1.5
    class: embedding
    engine: llamacpp
    reasoning: false
    context_window: 2048
    source:
      type: gguf
      url: https://huggingface.co/nomic-ai/nomic-embed-text-v1.5-GGUF/resolve/main/nomic-embed-text-v1.5.Q4_K_M.gguf
      sha256: d4e388894e09cf3816e8b0896d81d265b55e7a9fff9ab03fe8bf4ef5e11295ac
      size: 84106624

  # --- Reranker models (M3 phase 2b, ADR-0012) ----------------------------
  # CPU-bootable on llama.cpp's reranking mode (--reranking), so /v1/rerank is
  # provable on the per-PR tier. Rerankers, like embedding models, carry no tier.
  - name: bge-reranker-v2-m3
    class: reranker
    engine: llamacpp
    reasoning: false
    context_window: 8192
    source:
      type: gguf
      url: https://huggingface.co/gpustack/bge-reranker-v2-m3-GGUF/resolve/main/bge-reranker-v2-m3-Q4_K_M.gguf
      sha256: e186a244ed455b4ab66ec64339ce7427a6ae13f5c0b5e544de96e50f0f8b3673
      size: 438376864

  # --- vLLM tiers (GPU; cold-boot conformance deferred to phase 11) -------
  # Qwen3-8B is the vLLM half of the GPU acceptance run (scripts/acceptance.sh):
  # an 8B that fits a 24 GB acceptance GPU, where the 35B/GLM tiers below do not.
  # engine_args carry --enable-auto-tool-choice — vLLM rejects --tool-call-parser
  # without it, so the raw-spec acceptance run (which omitted it) failed at engine
  # start; the catalog path supplies the full, correct flag set.
  - name: qwen3-8b
    engine: vllm
    tier: sonnet
    reasoning: true
    context_window: 40960
    source:
      type: hf
      repo: Qwen/Qwen3-8B
    engine_args:
      - --enable-auto-tool-choice
      - --tool-call-parser
      - hermes
      - --reasoning-parser
      - qwen3

  - name: qwen3.5-35b-a3b
    engine: vllm
    tier: sonnet
    reasoning: true
    context_window: 262144
    source:
      type: hf
      repo: Qwen/Qwen3.5-35B-A3B
    engine_args:
      - --enable-auto-tool-choice
      - --tool-call-parser
      - hermes
      - --reasoning-parser
      - qwen3

  - name: glm-5.1
    engine: vllm
    tier: opus
    reasoning: true
    context_window: 200000
    source:
      type: hf
      repo: zai-org/GLM-5.1
    engine_args:
      - --enable-auto-tool-choice
      - --tool-call-parser
      - glm47
      - --reasoning-parser
      - glm45

  # --- MLX tiers (Apple Silicon; mlx-lm via Metal) ------------------------
  # mlx_lm.server exposes no model-metadata endpoint, so context_window here is
  # also what the gateway asserts against (worker.Config.ContextWindow). Cold-boot
  # conformance is the Apple-Silicon nightly tier (docs/open-questions.md).
  - name: qwen2.5-1.5b-instruct-mlx
    engine: mlx
    tier: haiku
    reasoning: false
    context_window: 32768
    source:
      type: hf
      repo: mlx-community/Qwen2.5-1.5B-Instruct-4bit
    sampling:
      temperature: 0.7
      top_p: 0.8

  - name: qwen2.5-7b-instruct-mlx
    engine: mlx
    tier: sonnet
    reasoning: false
    context_window: 32768
    source:
      type: hf
      repo: mlx-community/Qwen2.5-7B-Instruct-4bit
    sampling:
      temperature: 0.7
      top_p: 0.8

  # --- SGLang tiers (NVIDIA GPU; prefix-cache + structured-output strengths) ---
  # Cold-boot conformance is the GPU nightly tier, shared with vLLM
  # (docs/open-questions.md). engine_args carry SGLang's tool/reasoning parsers.
  - name: qwen2.5-7b-instruct-sglang
    engine: sglang
    tier: sonnet
    reasoning: false
    context_window: 32768
    source:
      type: hf
      repo: Qwen/Qwen2.5-7B-Instruct
    engine_args:
      - --tool-call-parser
      - qwen25
    sampling:
      temperature: 0.7
      top_p: 0.8

  - name: qwen3-8b-sglang
    engine: sglang
    tier: sonnet
    reasoning: true
    context_window: 40960
    source:
      type: hf
      repo: Qwen/Qwen3-8B
    engine_args:
      - --tool-call-parser
      - qwen25
      - --reasoning-parser
      - qwen3
