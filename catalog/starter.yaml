# Atlas starter catalog — curated, agent-tested model definitions.
#
# Seeded from docs/research/model-catalog-m0.md and pinned at build time
# (build-time decision 5: explicit versions, explicit upgrades). GGUF entries
# carry the exact sha256 the store verifies against; Hugging Face (vLLM) entries
# name the repo the engine resolves at boot.
#
# The small llama.cpp tier boots from cold on a CPU box (and in CI) — that is
# the phase-9 exit criterion. The larger vLLM tiers need a GPU; their cold-boot
# conformance is the full-matrix tier, deferred with the rest of the vLLM GPU
# run (docs/open-questions.md), and lands in the phase-11 acceptance pass.

models:
  # --- Small, CPU-bootable (laptop / haiku) -------------------------------
  - name: qwen2.5-1.5b-instruct
    engine: llamacpp
    tier: haiku
    reasoning: false
    context_window: 32768
    source:
      type: gguf
      url: https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf
      sha256: 6a1a2eb6d15622bf3c96857206351ba97e1af16c30d7a74ee38970e434e9407e
      size: 1117320736
    sampling:
      temperature: 0.7
      top_p: 0.8

  - name: qwen3-0.6b
    engine: llamacpp
    tier: haiku
    reasoning: true
    context_window: 40960
    source:
      type: gguf
      url: https://huggingface.co/Qwen/Qwen3-0.6B-GGUF/resolve/main/Qwen3-0.6B-Q8_0.gguf
      sha256: 9465e63a22add5354d9bb4b99e90117043c7124007664907259bd16d043bb031
      size: 639446688
    sampling:
      temperature: 0.6
      top_p: 0.95

  # --- vLLM tiers (GPU; cold-boot conformance deferred to phase 11) -------
  - name: qwen3.5-35b-a3b
    engine: vllm
    tier: sonnet
    reasoning: true
    context_window: 262144
    source:
      type: hf
      repo: Qwen/Qwen3.5-35B-A3B
    engine_args:
      - --enable-auto-tool-choice
      - --tool-call-parser
      - hermes
      - --reasoning-parser
      - qwen3

  - name: glm-5.1
    engine: vllm
    tier: opus
    reasoning: true
    context_window: 200000
    source:
      type: hf
      repo: zai-org/GLM-5.1
    engine_args:
      - --enable-auto-tool-choice
      - --tool-call-parser
      - glm47
      - --reasoning-parser
      - glm45

  # --- MLX tiers (Apple Silicon; mlx-lm via Metal) ------------------------
  # mlx_lm.server exposes no model-metadata endpoint, so context_window here is
  # also what the gateway asserts against (worker.Config.ContextWindow). Cold-boot
  # conformance is the Apple-Silicon nightly tier (docs/open-questions.md).
  - name: qwen2.5-1.5b-instruct-mlx
    engine: mlx
    tier: haiku
    reasoning: false
    context_window: 32768
    source:
      type: hf
      repo: mlx-community/Qwen2.5-1.5B-Instruct-4bit
    sampling:
      temperature: 0.7
      top_p: 0.8

  - name: qwen2.5-7b-instruct-mlx
    engine: mlx
    tier: sonnet
    reasoning: false
    context_window: 32768
    source:
      type: hf
      repo: mlx-community/Qwen2.5-7B-Instruct-4bit
    sampling:
      temperature: 0.7
      top_p: 0.8

  # --- SGLang tiers (NVIDIA GPU; prefix-cache + structured-output strengths) ---
  # Cold-boot conformance is the GPU nightly tier, shared with vLLM
  # (docs/open-questions.md). engine_args carry SGLang's tool/reasoning parsers.
  - name: qwen2.5-7b-instruct-sglang
    engine: sglang
    tier: sonnet
    reasoning: false
    context_window: 32768
    source:
      type: hf
      repo: Qwen/Qwen2.5-7B-Instruct
    engine_args:
      - --tool-call-parser
      - qwen25
    sampling:
      temperature: 0.7
      top_p: 0.8

  - name: qwen3-8b-sglang
    engine: sglang
    tier: sonnet
    reasoning: true
    context_window: 40960
    source:
      type: hf
      repo: Qwen/Qwen3-8B
    engine_args:
      - --tool-call-parser
      - qwen25
      - --reasoning-parser
      - qwen3
