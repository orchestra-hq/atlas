name: Nightly GPU acceptance

# The capable/GPU acceptance run that flips M0 to "done" (M0.5, ADR-0006):
# provision an on-demand GPU box, run the full conformance gate (G1–G10) + the
# real Claude Code smoke on both engines via scripts/acceptance.sh, tear it down.
#
# Provisioning is machulav/ec2-github-runner (not SkyPilot): it launches an
# ephemeral EC2 instance as a self-hosted runner, so acceptance.sh runs as native
# workflow steps on the GPU box — logs stream live, exit codes propagate, and the
# instance is always terminated by stop-runner. This replaced SkyPilot, whose Ray
# bootstrap clashed with the recent-driver AMI vLLM needs. On-demand (not spot)
# avoids the mid-run preemptions that repeatedly killed the SkyPilot runs.
#
# Dormant until enabled: start-runner is gated on GPU_ACCEPTANCE_ENABLED=true.
# Requires (see examples/acceptance/README.md): secret AWS_ROLE_ARN (OIDC); a
# GitHub App (Administration:write on this repo) via secrets ACCEPTANCE_APP_ID +
# ACCEPTANCE_APP_PRIVATE_KEY (mints the short-lived token that registers the
# self-hosted runner); vars ACCEPTANCE_SUBNET_ID, ACCEPTANCE_SECURITY_GROUP_ID,
# AWS_REGION.

on:
  schedule:
    - cron: "0 7 * * *" # 07:00 UTC nightly
  workflow_dispatch:
    inputs:
      engines:
        description: Engines to run (space-separated)
        default: vllm llamacpp

jobs:
  start-runner:
    name: Start GPU runner
    if: ${{ vars.GPU_ACCEPTANCE_ENABLED == 'true' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      id-token: write # mint the OIDC token AWS exchanges for short-lived creds
      contents: read
    outputs:
      label: ${{ steps.start.outputs.label }}
      ec2-instance-id: ${{ steps.start.outputs.ec2-instance-id }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-2' }}
      # Mint a short-lived (~1 h) installation token scoped to this repo's
      # Administration permission — the minimum GitHub requires to register a
      # self-hosted runner. Narrower than a PAT: one repo, no long-lived secret.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.ACCEPTANCE_APP_ID }}
          private-key: ${{ secrets.ACCEPTANCE_APP_PRIVATE_KEY }}
      - name: Start EC2 runner
        id: start
        uses: machulav/ec2-github-runner@343a1b2ae682e681c3cec9a235d882da17ff04ef # v2.6.1
        with:
          mode: start
          github-token: ${{ steps.app-token.outputs.token }}
          # On-demand g6.xlarge (1× L4, 24 GB). The Base OSS Nvidia Driver AMI
          # (Ubuntu 22.04, eu-west-2) carries a recent driver — required for
          # vLLM 0.23.0's CUDA-13 wheels. Refresh via:
          #   aws ssm get-parameter --region eu-west-2 \
          #     --name /aws/service/deeplearning/ami/x86_64/base-oss-nvidia-driver-gpu-ubuntu-22.04/latest/ami-id
          ec2-image-id: ami-0c5fe80eabe9a6a1f
          # g6.2xlarge (not xlarge): same L4 24 GB GPU, but 32 GB system RAM vs
          # 16 GB. The 16 GB host OOM-killed both engines staging weights through
          # RAM — Qwen3-8B's bf16 checkpoint alone is 15.3 GB ("Available RAM:
          # 11.49 GiB"). VRAM was never the limit; host RAM was.
          ec2-instance-type: g6.2xlarge
          # The AMI's 75 GB root fills up — vLLM venv + Qwen3-8B weights (~16 GB) +
          # the GGUFs + HF download temp blew past it ("No space left on device").
          ec2-volume-size: 200
          ec2-device-name: /dev/sda1
          ec2-volume-type: gp3
          subnet-id: ${{ vars.ACCEPTANCE_SUBNET_ID }}
          security-group-id: ${{ vars.ACCEPTANCE_SECURITY_GROUP_ID }}
          aws-resource-tags: >-
            [{"Key": "Name", "Value": "atlas-gpu-acceptance"},
             {"Key": "atlas-acceptance", "Value": "nightly"}]

  acceptance:
    name: GPU acceptance
    needs: start-runner
    runs-on: ${{ needs.start-runner.outputs.label }}
    timeout-minutes: 120
    # The machulav runner starts (from cloud-init, as root) without HOME set, so
    # Go's cache, uv's ~/.local, npm, and the claude config dir have nowhere to
    # live — setup-go's `go env` fails outright. Set it for the whole job.
    # IS_SANDBOX lets Claude Code accept --dangerously-skip-permissions as root
    # (it otherwise refuses); the ephemeral single-job runner IS the sandbox.
    env:
      HOME: /root
      IS_SANDBOX: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false # ephemeral one-shot box; nothing to cache across runs
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install uv + Claude Code
        # The runner is root, so npm -g needs no sudo — and sudo would reset PATH
        # and lose the setup-node tool-cache npm ("npm: command not found").
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          npm i -g @anthropic-ai/claude-code
      - name: Run acceptance (G1–G10 + Claude Code smoke, both engines)
        env:
          ACCEPTANCE_ENGINES: ${{ github.event.inputs.engines || 'vllm llamacpp' }}
        run: |
          nvidia-smi || { echo "no GPU visible on the host" >&2; exit 1; }
          bash scripts/acceptance.sh

  stop-runner:
    name: Stop GPU runner
    needs: [start-runner, acceptance]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # Always terminate a started runner — even if acceptance failed — so a GPU
    # instance is never leaked. Skips only when start-runner did not start one.
    if: ${{ always() && needs.start-runner.result == 'success' }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-2' }}
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.ACCEPTANCE_APP_ID }}
          private-key: ${{ secrets.ACCEPTANCE_APP_PRIVATE_KEY }}
      - name: Stop EC2 runner
        uses: machulav/ec2-github-runner@343a1b2ae682e681c3cec9a235d882da17ff04ef # v2.6.1
        with:
          mode: stop
          github-token: ${{ steps.app-token.outputs.token }}
          label: ${{ needs.start-runner.outputs.label }}
          ec2-instance-id: ${{ needs.start-runner.outputs.ec2-instance-id }}
