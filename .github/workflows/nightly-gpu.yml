name: Nightly acceptance

# The capable acceptance run that flips M0 to "done" (M0.5, ADR-0006): provision
# ephemeral on-demand boxes, run the full conformance gate (G1–G10) + the real
# Claude Code smoke per engine via scripts/acceptance.sh, tear them down.
#
# Independent tracks (run in parallel), because the engines want different
# hardware (ADR-0001: llama.cpp is the portable/CPU engine, vLLM the GPU path):
#   • GPU track   — g6.2xlarge (L4 24 GB), serves vLLM (closed out M0).
#   • CPU track   — c7i.4xlarge (compute-optimised, no GPU), serves llama.cpp.
#   • fleet track — TWO boxes (a c7i.4xlarge control plane + co-located llama.cpp
#     worker, and a g6.2xlarge cross-host vLLM worker) exercising G1–G14 across
#     genuinely separate machines: the multi-host run that guards M1
#     (docs/internal/m1-acceptance.md). In the default tracks — runs on the nightly schedule.
#   • sglang track — g6.2xlarge (same AMI as GPU), serves SGLang. The M2 engine-
#     breadth cell (G17): G1–G8+G10 on a second NVIDIA-GPU server (docs/internal/m2-acceptance.md).
#   • mlx track — a blacksmith-6vcpu-macos-latest HOSTED runner (Apple Silicon /
#     Metal), serves MLX. The other M2 G17 cell — no machulav/EC2 (the runner is
#     managed), so it has no start/stop jobs.
# llama.cpp ships no Linux CUDA prebuilt, so it stays CPU-only here; GPU is vLLM's
# (and SGLang's) lane. Each EC2 track provisions its own ephemeral self-hosted
# runner(s) via machulav/ec2-github-runner (on-demand, no spot preemption) and
# always tears them down. acceptance.sh is identical on the GPU/CPU/sglang/mlx
# tracks — only ACCEPTANCE_ENGINES (and CONF_REQUIRE for the G17 cells) differs;
# the fleet track runs scripts/acceptance-fleet.sh (host A) +
# scripts/acceptance-fleet-worker.sh (host B).
#
# Dormant until enabled: start jobs are gated on GPU_ACCEPTANCE_ENABLED=true.
# Requires (see examples/acceptance/README.md): secret AWS_ROLE_ARN (OIDC); a
# GitHub App (Administration:write on this repo) via secrets ACCEPTANCE_APP_ID +
# ACCEPTANCE_APP_PRIVATE_KEY (mints the short-lived runner-registration token);
# vars ACCEPTANCE_SUBNET_ID, ACCEPTANCE_SECURITY_GROUP_ID, AWS_REGION.
# The fleet track adds two account-side prerequisites (project owner's call,
# 2026-06-25): (a) the security group must allow the server's wss port (9443) FROM
# ITSELF, so host B can dial host A's private IP within the VPC; (b) the OIDC role
# (AWS_ROLE_ARN) needs ssm:PutParameter/GetParameter/DeleteParameter on
# arn:aws:ssm:*:*:parameter/atlas/nightly/* plus kms:Encrypt/Decrypt on the aws/ssm
# managed key — the two hosts rendezvous on an SSM SecureString (pin/token/key).

on:
  schedule:
    - cron: "0 7 * * *" # 07:00 UTC nightly
  workflow_dispatch:
    inputs:
      tracks:
        description: Tracks to run (space-separated; "gpu", "cpu", "fleet", "sglang", "mlx", or any combination)
        default: gpu cpu fleet sglang mlx

jobs:
  # ----------------------------------------------------------------- GPU: vLLM
  start-gpu-runner:
    name: Start GPU runner
    if: ${{ vars.GPU_ACCEPTANCE_ENABLED == 'true' && contains(github.event.inputs.tracks || 'gpu cpu fleet sglang mlx', 'gpu') }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      id-token: write
      contents: read
    outputs:
      label: ${{ steps.start.outputs.label }}
      ec2-instance-id: ${{ steps.start.outputs.ec2-instance-id }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-2' }}
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.ACCEPTANCE_APP_ID }}
          private-key: ${{ secrets.ACCEPTANCE_APP_PRIVATE_KEY }}
      - name: Start EC2 runner
        id: start
        uses: machulav/ec2-github-runner@343a1b2ae682e681c3cec9a235d882da17ff04ef # v2.6.1
        with:
          mode: start
          github-token: ${{ steps.app-token.outputs.token }}
          # Base OSS Nvidia Driver AMI (Ubuntu 22.04, eu-west-2) — recent driver
          # for vLLM 0.23.0's CUDA-13 wheels. Refresh via:
          #   aws ssm get-parameter --region eu-west-2 \
          #     --name /aws/service/deeplearning/ami/x86_64/base-oss-nvidia-driver-gpu-ubuntu-22.04/latest/ami-id
          ec2-image-id: ami-0c5fe80eabe9a6a1f
          # g6.2xlarge: L4 24 GB + 32 GB RAM (16 GB OOM-killed weight staging).
          ec2-instance-type: g6.2xlarge
          ec2-volume-size: 200 # 75 GB AMI default ran out of space (venv + weights)
          ec2-device-name: /dev/sda1
          ec2-volume-type: gp3
          subnet-id: ${{ vars.ACCEPTANCE_SUBNET_ID }}
          security-group-id: ${{ vars.ACCEPTANCE_SECURITY_GROUP_ID }}
          aws-resource-tags: >-
            [{"Key": "Name", "Value": "atlas-acceptance-gpu"},
             {"Key": "atlas-acceptance", "Value": "nightly"}]

  vllm-acceptance:
    name: vLLM acceptance (GPU)
    needs: start-gpu-runner
    runs-on: ${{ needs.start-gpu-runner.outputs.label }}
    timeout-minutes: 120
    # The machulav runner starts (from cloud-init, as root) without HOME set, so
    # Go's cache, uv's ~/.local, npm, and the claude config dir have nowhere to
    # live. IS_SANDBOX lets Claude Code accept --dangerously-skip-permissions as
    # root (the ephemeral single-job runner is the sandbox).
    env:
      HOME: /root
      IS_SANDBOX: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false # ephemeral one-shot box
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install uv + Claude Code
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          npm i -g @anthropic-ai/claude-code
      - name: Run acceptance (vLLM)
        env:
          ACCEPTANCE_ENGINES: vllm
        run: |
          nvidia-smi || { echo "no GPU visible on the host" >&2; exit 1; }
          bash scripts/acceptance.sh
      # Always upload — the per-cell matrix (with failure messages) is most useful
      # exactly when the gate is red, and vitest runs --silent so a failing TS cell
      # prints nothing to the logs.
      - name: Upload conformance matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-vllm
          path: |
            conformance/results/matrix-*.json
            conformance/results/capability-matrix.json
            conformance/results/CAPABILITY.md
          if-no-files-found: warn

  stop-gpu-runner:
    name: Stop GPU runner
    needs: [start-gpu-runner, vllm-acceptance]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: ${{ always() && needs.start-gpu-runner.result == 'success' }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-2' }}
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.ACCEPTANCE_APP_ID }}
          private-key: ${{ secrets.ACCEPTANCE_APP_PRIVATE_KEY }}
      - name: Stop EC2 runner
        uses: machulav/ec2-github-runner@343a1b2ae682e681c3cec9a235d882da17ff04ef # v2.6.1
        with:
          mode: stop
          github-token: ${{ steps.app-token.outputs.token }}
          label: ${{ needs.start-gpu-runner.outputs.label }}
          ec2-instance-id: ${{ needs.start-gpu-runner.outputs.ec2-instance-id }}

  # ------------------------------------------------------------ CPU: llama.cpp
  start-cpu-runner:
    name: Start CPU runner
    if: ${{ vars.GPU_ACCEPTANCE_ENABLED == 'true' && contains(github.event.inputs.tracks || 'gpu cpu fleet sglang mlx', 'cpu') }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      id-token: write
      contents: read
    outputs:
      label: ${{ steps.start.outputs.label }}
      ec2-instance-id: ${{ steps.start.outputs.ec2-instance-id }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-2' }}
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.ACCEPTANCE_APP_ID }}
          private-key: ${{ secrets.ACCEPTANCE_APP_PRIVATE_KEY }}
      - name: Start EC2 runner
        id: start
        uses: machulav/ec2-github-runner@343a1b2ae682e681c3cec9a235d882da17ff04ef # v2.6.1
        with:
          mode: start
          github-token: ${{ steps.app-token.outputs.token }}
          # Same AMI as the GPU track (it already carries the runner prereqs); the
          # NVIDIA bits go unused on a CPU instance. c7i.4xlarge = 16 fast vCPU,
          # 32 GB RAM — enough to give the capable-model llama.cpp run (and its
          # Claude Code smoke) a real chance on CPU.
          ec2-image-id: ami-0c5fe80eabe9a6a1f
          ec2-instance-type: c7i.4xlarge
          ec2-volume-size: 100 # Q4 GGUFs (~10 GB) + base image
          ec2-device-name: /dev/sda1
          ec2-volume-type: gp3
          subnet-id: ${{ vars.ACCEPTANCE_SUBNET_ID }}
          security-group-id: ${{ vars.ACCEPTANCE_SECURITY_GROUP_ID }}
          aws-resource-tags: >-
            [{"Key": "Name", "Value": "atlas-acceptance-cpu"},
             {"Key": "atlas-acceptance", "Value": "nightly"}]

  llama-acceptance:
    name: llama.cpp acceptance (CPU)
    needs: start-cpu-runner
    runs-on: ${{ needs.start-cpu-runner.outputs.label }}
    timeout-minutes: 120
    env:
      HOME: /root
      IS_SANDBOX: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install uv + Claude Code
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          npm i -g @anthropic-ai/claude-code
      - name: Run acceptance (llama.cpp, CPU)
        env:
          ACCEPTANCE_ENGINES: llamacpp
          # The Claude Code smoke is a GPU/capable-tier cell: a 7B on CPU can't
          # drive the agentic loop within the budget (it times out even on a fast
          # 16-vCPU c7i), so it's skipped here and gated on the vLLM/GPU track.
          # This track validates the capable model's full API conformance on CPU.
          CONF_CLAUDE_CODE_SMOKE: "0"
        run: bash scripts/acceptance.sh
      # Always upload — the per-cell matrix (with failure messages) is most useful
      # exactly when the gate is red, and vitest runs --silent so a failing TS cell
      # prints nothing to the logs.
      - name: Upload conformance matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-llamacpp
          path: |
            conformance/results/matrix-*.json
            conformance/results/capability-matrix.json
            conformance/results/CAPABILITY.md
          if-no-files-found: warn

  stop-cpu-runner:
    name: Stop CPU runner
    needs: [start-cpu-runner, llama-acceptance]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: ${{ always() && needs.start-cpu-runner.result == 'success' }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-2' }}
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.ACCEPTANCE_APP_ID }}
          private-key: ${{ secrets.ACCEPTANCE_APP_PRIVATE_KEY }}
      - name: Stop EC2 runner
        uses: machulav/ec2-github-runner@343a1b2ae682e681c3cec9a235d882da17ff04ef # v2.6.1
        with:
          mode: stop
          github-token: ${{ steps.app-token.outputs.token }}
          label: ${{ needs.start-cpu-runner.outputs.label }}
          ec2-instance-id: ${{ needs.start-cpu-runner.outputs.ec2-instance-id }}

  # ------------------------------------------- fleet: multi-host (M1 acceptance)
  # Two ephemeral boxes in the same VPC/SG: host A (c7i, control plane + a
  # co-located llama.cpp worker) and host B (g6, a cross-host vLLM worker). They
  # run concurrently and rendezvous on SSM — host A publishes the join bundle
  # (private IP, wss pin, token, key) and host B reads it, joins over wss://, and
  # stays up until host A signals done. See docs/internal/m1-acceptance.md.
  start-fleet-server-runner:
    name: Start fleet server runner (host A)
    if: ${{ vars.GPU_ACCEPTANCE_ENABLED == 'true' && contains(github.event.inputs.tracks || 'gpu cpu fleet sglang mlx', 'fleet') }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      id-token: write
      contents: read
    outputs:
      label: ${{ steps.start.outputs.label }}
      ec2-instance-id: ${{ steps.start.outputs.ec2-instance-id }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-2' }}
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.ACCEPTANCE_APP_ID }}
          private-key: ${{ secrets.ACCEPTANCE_APP_PRIVATE_KEY }}
      - name: Start EC2 runner
        id: start
        uses: machulav/ec2-github-runner@343a1b2ae682e681c3cec9a235d882da17ff04ef # v2.6.1
        with:
          mode: start
          github-token: ${{ steps.app-token.outputs.token }}
          ec2-image-id: ami-0c5fe80eabe9a6a1f
          ec2-instance-type: c7i.4xlarge # control plane + co-located llama.cpp worker
          ec2-volume-size: 100
          ec2-device-name: /dev/sda1
          ec2-volume-type: gp3
          subnet-id: ${{ vars.ACCEPTANCE_SUBNET_ID }}
          security-group-id: ${{ vars.ACCEPTANCE_SECURITY_GROUP_ID }}
          aws-resource-tags: >-
            [{"Key": "Name", "Value": "atlas-acceptance-fleet-server"},
             {"Key": "atlas-acceptance", "Value": "nightly"}]

  start-fleet-worker-runner:
    name: Start fleet worker runner (host B, GPU)
    if: ${{ vars.GPU_ACCEPTANCE_ENABLED == 'true' && contains(github.event.inputs.tracks || 'gpu cpu fleet sglang mlx', 'fleet') }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      id-token: write
      contents: read
    outputs:
      label: ${{ steps.start.outputs.label }}
      ec2-instance-id: ${{ steps.start.outputs.ec2-instance-id }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-2' }}
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.ACCEPTANCE_APP_ID }}
          private-key: ${{ secrets.ACCEPTANCE_APP_PRIVATE_KEY }}
      - name: Start EC2 runner
        id: start
        uses: machulav/ec2-github-runner@343a1b2ae682e681c3cec9a235d882da17ff04ef # v2.6.1
        with:
          mode: start
          github-token: ${{ steps.app-token.outputs.token }}
          ec2-image-id: ami-0c5fe80eabe9a6a1f
          ec2-instance-type: g6.2xlarge # cross-host vLLM worker
          ec2-volume-size: 200
          ec2-device-name: /dev/sda1
          ec2-volume-type: gp3
          subnet-id: ${{ vars.ACCEPTANCE_SUBNET_ID }}
          security-group-id: ${{ vars.ACCEPTANCE_SECURITY_GROUP_ID }}
          aws-resource-tags: >-
            [{"Key": "Name", "Value": "atlas-acceptance-fleet-worker"},
             {"Key": "atlas-acceptance", "Value": "nightly"}]

  fleet-worker:
    name: Fleet vLLM worker (host B)
    needs: start-fleet-worker-runner
    runs-on: ${{ needs.start-fleet-worker-runner.outputs.label }}
    timeout-minutes: 120
    permissions:
      id-token: write
      contents: read
    env:
      HOME: /root
      SSM_PREFIX: /atlas/nightly/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-2' }}
      - name: Join the fleet (vLLM, cross-host)
        run: bash scripts/acceptance-fleet-worker.sh

  fleet-server:
    name: Fleet control plane + gate (host A)
    needs: start-fleet-server-runner
    runs-on: ${{ needs.start-fleet-server-runner.outputs.label }}
    timeout-minutes: 120
    permissions:
      id-token: write
      contents: read
    env:
      HOME: /root
      IS_SANDBOX: "1"
      FLEET_REMOTE_WORKER: "1"
      SSM_PREFIX: /atlas/nightly/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-2' }}
      - name: Run fleet acceptance (G1–G14 across hosts)
        run: bash scripts/acceptance-fleet.sh
      - name: Upload conformance matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-fleet
          path: |
            conformance/results/matrix-*.json
            conformance/results/capability-matrix.json
            conformance/results/CAPABILITY.md
          if-no-files-found: warn

  stop-fleet-server-runner:
    name: Stop fleet server runner (host A)
    needs: [start-fleet-server-runner, fleet-server]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: ${{ always() && needs.start-fleet-server-runner.result == 'success' }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-2' }}
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.ACCEPTANCE_APP_ID }}
          private-key: ${{ secrets.ACCEPTANCE_APP_PRIVATE_KEY }}
      - name: Stop EC2 runner
        uses: machulav/ec2-github-runner@343a1b2ae682e681c3cec9a235d882da17ff04ef # v2.6.1
        with:
          mode: stop
          github-token: ${{ steps.app-token.outputs.token }}
          label: ${{ needs.start-fleet-server-runner.outputs.label }}
          ec2-instance-id: ${{ needs.start-fleet-server-runner.outputs.ec2-instance-id }}

  stop-fleet-worker-runner:
    name: Stop fleet worker runner (host B)
    needs: [start-fleet-worker-runner, fleet-worker]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: ${{ always() && needs.start-fleet-worker-runner.result == 'success' }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-2' }}
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.ACCEPTANCE_APP_ID }}
          private-key: ${{ secrets.ACCEPTANCE_APP_PRIVATE_KEY }}
      - name: Stop EC2 runner
        uses: machulav/ec2-github-runner@343a1b2ae682e681c3cec9a235d882da17ff04ef # v2.6.1
        with:
          mode: stop
          github-token: ${{ steps.app-token.outputs.token }}
          label: ${{ needs.start-fleet-worker-runner.outputs.label }}
          ec2-instance-id: ${{ needs.start-fleet-worker-runner.outputs.ec2-instance-id }}

  # --------------------------------------------------- sglang (M2 G17, NVIDIA)
  # A second NVIDIA-GPU server alongside vLLM. Same on-demand g6 + AMI as the GPU
  # track; acceptance.sh is identical, only ACCEPTANCE_ENGINES + the G17 gate
  # scope (CONF_REQUIRE=G1–G8,G10, no agent smoke) differ. See docs/internal/m2-acceptance.md.
  start-sglang-runner:
    name: Start SGLang runner (GPU)
    if: ${{ vars.GPU_ACCEPTANCE_ENABLED == 'true' && contains(github.event.inputs.tracks || 'gpu cpu fleet sglang mlx', 'sglang') }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      id-token: write
      contents: read
    outputs:
      label: ${{ steps.start.outputs.label }}
      ec2-instance-id: ${{ steps.start.outputs.ec2-instance-id }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-2' }}
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.ACCEPTANCE_APP_ID }}
          private-key: ${{ secrets.ACCEPTANCE_APP_PRIVATE_KEY }}
      - name: Start EC2 runner
        id: start
        uses: machulav/ec2-github-runner@343a1b2ae682e681c3cec9a235d882da17ff04ef # v2.6.1
        with:
          mode: start
          github-token: ${{ steps.app-token.outputs.token }}
          ec2-image-id: ami-0c5fe80eabe9a6a1f
          ec2-instance-type: g6.2xlarge # L4 24 GB — same as the vLLM GPU track
          ec2-volume-size: 200
          ec2-device-name: /dev/sda1
          ec2-volume-type: gp3
          subnet-id: ${{ vars.ACCEPTANCE_SUBNET_ID }}
          security-group-id: ${{ vars.ACCEPTANCE_SECURITY_GROUP_ID }}
          aws-resource-tags: >-
            [{"Key": "Name", "Value": "atlas-acceptance-sglang"},
             {"Key": "atlas-acceptance", "Value": "nightly"}]

  sglang-acceptance:
    name: SGLang acceptance (GPU)
    needs: start-sglang-runner
    runs-on: ${{ needs.start-sglang-runner.outputs.label }}
    timeout-minutes: 120
    env:
      HOME: /root
      IS_SANDBOX: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install ninja (SGLang JIT-compiles core CUDA kernels at startup)
        # Unlike vLLM (whose only JIT path we disable via VLLM_USE_FLASHINFER_SAMPLER=0),
        # SGLang 0.5.10 JIT-compiles core kernels — fused RoPE, attention — at server
        # startup via `ninja` (sglang.jit_kernel/tvm_ffi), regardless of attention
        # backend. The driver AMI ships gcc + the CUDA toolkit (nvcc) but not ninja,
        # so install it and put nvcc on PATH for the compile.
        run: |
          apt-get update -y && apt-get install -y ninja-build
          ninja --version
          if [ -d /usr/local/cuda/bin ]; then echo "/usr/local/cuda/bin" >> "$GITHUB_PATH"; fi
          command -v nvcc && nvcc --version || echo "WARN: nvcc not on PATH; the JIT compile may fail"
      - name: Run acceptance (SGLang)
        env:
          ACCEPTANCE_ENGINES: sglang
          # G17 scope: G1–G8,G10 (no G9 agent harness — 7–8B models drive the
          # agentic loop only intermittently) and no Claude Code smoke.
          CONF_REQUIRE: G1,G2,G3,G4,G5,G6,G7,G8,G10
          CONF_CLAUDE_CODE_SMOKE: "0"
        run: |
          nvidia-smi || { echo "no GPU visible on the host" >&2; exit 1; }
          bash scripts/acceptance.sh
      - name: Upload conformance matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-sglang
          path: |
            conformance/results/matrix-*.json
            conformance/results/capability-matrix.json
            conformance/results/CAPABILITY.md
          if-no-files-found: warn

  stop-sglang-runner:
    name: Stop SGLang runner
    needs: [start-sglang-runner, sglang-acceptance]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: ${{ always() && needs.start-sglang-runner.result == 'success' }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-2' }}
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.ACCEPTANCE_APP_ID }}
          private-key: ${{ secrets.ACCEPTANCE_APP_PRIVATE_KEY }}
      - name: Stop EC2 runner
        uses: machulav/ec2-github-runner@343a1b2ae682e681c3cec9a235d882da17ff04ef # v2.6.1
        with:
          mode: stop
          github-token: ${{ steps.app-token.outputs.token }}
          label: ${{ needs.start-sglang-runner.outputs.label }}
          ec2-instance-id: ${{ needs.start-sglang-runner.outputs.ec2-instance-id }}

  # ------------------------------------------- mlx (M2 G17, Apple Silicon/Metal)
  # The other M2 engine-breadth cell. MLX runs only on darwin/arm64, so this uses
  # a Blacksmith HOSTED macOS runner (managed — no machulav start/stop jobs). The
  # runner is a normal user (HOME set; not root cloud-init), so no HOME/IS_SANDBOX
  # overrides. acceptance.sh is identical; the MLX catalog tier is non-reasoning,
  # so G4 thinking skips and its graceful case runs. See docs/internal/m2-acceptance.md.
  mlx-acceptance:
    name: MLX acceptance (Apple Silicon)
    if: ${{ vars.GPU_ACCEPTANCE_ENABLED == 'true' && contains(github.event.inputs.tracks || 'gpu cpu fleet sglang mlx', 'mlx') }}
    runs-on: blacksmith-6vcpu-macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run acceptance (MLX)
        env:
          ACCEPTANCE_ENGINES: mlx
          CONF_REQUIRE: G1,G2,G3,G4,G5,G6,G7,G8,G10
          CONF_CLAUDE_CODE_SMOKE: "0"
        run: bash scripts/acceptance.sh
      - name: Upload conformance matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-mlx
          path: |
            conformance/results/matrix-*.json
            conformance/results/capability-matrix.json
            conformance/results/CAPABILITY.md
          if-no-files-found: warn
