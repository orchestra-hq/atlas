name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: Lint
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false # golangci-lint-action manages its own cache
      - name: Check go.mod is tidy
        run: go mod tidy -diff
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2 # keep in sync with local installs (brew install golangci-lint)

  test:
    name: Test
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...

  release-dry-run:
    name: Release dry-run
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # goreleaser derives the version from git history
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --snapshot --clean

  conformance:
    name: Conformance (llama.cpp)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      # Conformance-tier models, resolved from the starter catalog (phase 9):
      # tiny enough to run on a CPU runner, capable enough to pass the structural
      # G-group tasks at temperature 0. The non-reasoning model carries G1–G3 +
      # the G4 graceful-no-op case; the reasoning model (Qwen3, hybrid thinking)
      # carries the G4 thinking cases. Both are gguf catalog entries, so CI
      # exercises the cold-boot path: `atlas pull` → store → `atlas up`.
      CONF_MODEL_NAME: qwen2.5-1.5b-instruct
      CONF_REASONING_NAME: qwen3-0.6b
      ATLAS_STATE_DIR: ${{ github.workspace }}/.atlas-state
      # Where atlas writes its request log; G10 reads it to assert per-request
      # token counts are logged. Absolute so the harness (run from conformance/)
      # and the Start Atlas step (run from the workspace root) agree.
      ATLAS_LOG_FILE: ${{ github.workspace }}/atlas.log
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@v8.2.0 # no floating major tag — pin exact
        with:
          enable-cache: true
          cache-dependency-glob: conformance/uv.lock
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: conformance/ts/package-lock.json
      - run: npm ci --no-fund --no-audit
        working-directory: conformance/ts
      - name: Build atlas
        run: go build -o atlas ./cmd/atlas
      # The store is content-addressed by the catalog's pinned sha256, so cache
      # it keyed on the catalog file; only the first run pays the download.
      - name: Cache model store
        uses: actions/cache@v4
        with:
          path: ${{ env.ATLAS_STATE_DIR }}/store
          key: conf-store-${{ hashFiles('catalog/starter.yaml') }}
      # Phase-9 cold-boot proof: pull the catalog models into the store (verified
      # against their pinned digests), then boot from it. A no-op on a cache hit.
      - name: Pull catalog models
        run: ./atlas pull "$CONF_MODEL_NAME" "$CONF_REASONING_NAME"
      # atlas provisions the pinned llama.cpp runtime into the state dir on
      # first run; cache it keyed on the pinned tag (keep in sync with
      # internal/runtime.LlamaCppTag).
      - name: Cache llama.cpp runtime
        uses: actions/cache@v4
        with:
          path: ${{ env.ATLAS_STATE_DIR }}/runtimes
          key: llamacpp-runtime-${{ runner.os }}-${{ runner.arch }}-b9611
      # API keys replaced the shared --api-key secret in phase 5 (ADR-0008): mint
      # a key into the state-dir store and hand it to the harness via the env. The
      # server reads the same store, so it accepts this key.
      - name: Provision API key
        run: echo "ATLAS_API_KEY=$(./atlas keys create --state-dir "$ATLAS_STATE_DIR" --quiet)" >> "$GITHUB_ENV"
      - name: Start Atlas
        run: |
          ./atlas up \
            --model "$CONF_MODEL_NAME" \
            --model "$CONF_REASONING_NAME" \
            --alias "claude-sonnet-4-6=${CONF_MODEL_NAME}" \
            --alias "claude-haiku-4-5=${CONF_MODEL_NAME}" \
            --alias "claude-opus-4-1=${CONF_REASONING_NAME}" \
            --addr 127.0.0.1:8080 > "$ATLAS_LOG_FILE" 2>&1 &
          echo $! > atlas.pid
          # Readiness, not just liveness: wait until a model can actually answer.
          for _ in $(seq 1 150); do
            curl -sf -o /dev/null http://127.0.0.1:8080/readyz && break
            sleep 2
          done
          if ! curl -sf -o /dev/null http://127.0.0.1:8080/readyz; then
            echo "::error::Atlas did not become ready"; cat "$ATLAS_LOG_FILE"; exit 1
          fi
      # Gate: G1-G10 green on the real gateway — the full M0 surface on the
      # llama.cpp CPU tier: messages, streaming, tools, thinking, models+aliases,
      # count_tokens, Anthropic-shaped errors (incl. pre-dispatch context-window
      # rejection), the OpenAI /v1/chat/completions surface, the ops minimum
      # (/healthz, /readyz, token counts in logs), and G9 (agent harness). G9's
      # agent-sdk cell drives a >=3-call streamed tool loop through Atlas; its
      # real-Claude-Code drop-in cell is opt-in (CONF_CLAUDE_CODE_SMOKE) — the
      # 1.5B CPU-tier model drives Claude Code only intermittently, so that cell
      # and the vLLM full matrix are the capable/GPU acceptance tier (M0 "done"
      # is gated on that run; see docs/open-questions.md), not the per-PR CPU gate.
      - name: Run harness
        run: |
          uv run --locked python run.py \
            --base-url http://127.0.0.1:8080 \
            --engine llamacpp --model "$CONF_MODEL_NAME" \
            --reasoning-model "$CONF_REASONING_NAME" \
            --require G1,G2,G3,G4,G5,G6,G7,G8,G9,G10
        working-directory: conformance
      - name: Stop Atlas
        if: always()
        run: kill "$(cat atlas.pid)" 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: conformance-matrix
          path: conformance/results/matrix.json

  conformance-fleet:
    name: Conformance (two-process)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      # Same conformance-tier models as the single-node job, but served by a
      # separate `atlas worker` process that joins `atlas server` over the
      # WebSocket channel — the M1 phase-2 proof that the full M0 surface holds
      # when inference transits the worker channel rather than an in-process one.
      CONF_MODEL_NAME: qwen2.5-1.5b-instruct
      CONF_REASONING_NAME: qwen3-0.6b
      ATLAS_STATE_DIR: ${{ github.workspace }}/.atlas-state
      ATLAS_JOIN_TOKEN: conformance-join-token
      # The gateway runs inside `atlas server`, so its request log (G10 token
      # counts) is the server process's log.
      ATLAS_LOG_FILE: ${{ github.workspace }}/atlas-server.log
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@v8.2.0 # no floating major tag — pin exact
        with:
          enable-cache: true
          cache-dependency-glob: conformance/uv.lock
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: conformance/ts/package-lock.json
      - run: npm ci --no-fund --no-audit
        working-directory: conformance/ts
      - name: Build atlas
        run: go build -o atlas ./cmd/atlas
      # Shares the single-node job's content-addressed store and pinned runtime
      # caches (same keys); only the worker process needs them here.
      - name: Cache model store
        uses: actions/cache@v4
        with:
          path: ${{ env.ATLAS_STATE_DIR }}/store
          key: conf-store-${{ hashFiles('catalog/starter.yaml') }}
      - name: Pull catalog models
        run: ./atlas pull "$CONF_MODEL_NAME" "$CONF_REASONING_NAME"
      - name: Cache llama.cpp runtime
        uses: actions/cache@v4
        with:
          path: ${{ env.ATLAS_STATE_DIR }}/runtimes
          key: llamacpp-runtime-${{ runner.os }}-${{ runner.arch }}-b9611
      # API keys replaced the shared --api-key secret in phase 5 (ADR-0008): mint
      # a key into the state-dir store the server reads. This fleet job drives the
      # admin surface (atlas deploy/stop, /admin/deployments), so the key is
      # admin-scoped (phase 5b) — admin keys also pass the client /v1 surface.
      - name: Provision API key
        run: echo "ATLAS_API_KEY=$(./atlas keys create --state-dir "$ATLAS_STATE_DIR" --admin --quiet)" >> "$GITHUB_ENV"
      - name: Start Atlas server + worker
        run: |
          # Control plane: gateway + hub, no local engine. Tier aliases resolve
          # once the worker registers their targets. Auto-start is disabled here so
          # the deterministic gate steps (G11, Remote deploy) can assert a model
          # becomes unservable when its worker leaves / is stopped — otherwise a
          # request would silently auto-redeploy it onto a surviving worker. The
          # auto-start scenario runs its own server below.
          ./atlas server \
            --addr 127.0.0.1:9090 --autostart-timeout 0 \
            --token "$ATLAS_JOIN_TOKEN" \
            --alias "claude-sonnet-4-6=${CONF_MODEL_NAME}" \
            --alias "claude-haiku-4-5=${CONF_MODEL_NAME}" \
            --alias "claude-opus-4-1=${CONF_REASONING_NAME}" > "$ATLAS_LOG_FILE" 2>&1 &
          echo $! > server.pid
          # Worker: provisions the engine, loads both models, dials the hub.
          ./atlas worker \
            --join ws://127.0.0.1:9090/workers/connect --token "$ATLAS_JOIN_TOKEN" \
            --model "$CONF_MODEL_NAME" --model "$CONF_REASONING_NAME" > atlas-worker.log 2>&1 &
          echo $! > worker.pid
          # The server's /readyz flips to 200 only once the worker has joined and
          # registered its models — exactly the two-process readiness signal.
          for _ in $(seq 1 150); do
            curl -sf -o /dev/null http://127.0.0.1:9090/readyz && break
            sleep 2
          done
          if ! curl -sf -o /dev/null http://127.0.0.1:9090/readyz; then
            echo "::error::two-process Atlas did not become ready"
            echo "=== server ==="; cat "$ATLAS_LOG_FILE"
            echo "=== worker ==="; cat atlas-worker.log
            exit 1
          fi
      # Gate: G1-G8 + G10 green against the two-process deployment — the full M0
      # surface with every request proxied and streamed over the worker channel.
      # G9 (agent harness) is not part of the phase-2 exit criterion.
      - name: Run harness
        run: |
          uv run --locked python run.py \
            --base-url http://127.0.0.1:9090 \
            --engine llamacpp --model "$CONF_MODEL_NAME" \
            --reasoning-model "$CONF_REASONING_NAME" \
            --require G1,G2,G3,G4,G5,G6,G7,G8,G10
        working-directory: conformance
      # Phase-3 exit criterion (G-fleet-ops): graceful drain on SIGTERM and the
      # heartbeat-timeout backstop for a hard-killed worker. Behavioral, so it
      # rides the two-process deployment rather than a new conformance G-group.
      - name: Fleet-ops scenarios (drain + heartbeat timeout)
        run: |
          set -uo pipefail
          API=http://127.0.0.1:9090
          payload() { # $1 = max_tokens, $2 = prompt
            printf '{"model":"%s","max_tokens":%s,"messages":[{"role":"user","content":"%s"}]}' \
              "$CONF_MODEL_NAME" "$1" "$2"
          }

          echo "=== Drain: in-flight request completes; new requests are refused ==="
          # Start a buffered request and let it reach the worker mid-generation.
          ( curl -sS -m 120 -o /tmp/drain_body.txt -w '%{http_code}' \
              -H "x-api-key: $ATLAS_API_KEY" -H 'content-type: application/json' \
              "$API/v1/messages" -d "$(payload 512 'Write a long detailed paragraph about the history of computing.')" \
              > /tmp/drain_code.txt ) &
          DRAIN_PID=$!
          sleep 3
          # SIGTERM the worker: it should finish the in-flight request, refuse new
          # ones, then disconnect (its route is removed on the drain frame).
          kill -TERM "$(cat worker.pid)"
          sleep 2
          NEW=$(curl -sS -m 30 -o /dev/null -w '%{http_code}' \
            -H "x-api-key: $ATLAS_API_KEY" -H 'content-type: application/json' \
            "$API/v1/messages" -d "$(payload 16 'hi')" || true)
          wait "$DRAIN_PID" || true
          DRAIN_CODE=$(cat /tmp/drain_code.txt)
          echo "in-flight drain request → $DRAIN_CODE ; post-drain new request → $NEW"
          if [ "$DRAIN_CODE" != "200" ]; then
            echo "::error::drain did not let the in-flight request complete (got $DRAIN_CODE)"; cat /tmp/drain_body.txt; exit 1
          fi
          if [ "$NEW" = "200" ]; then
            echo "::error::a new request was accepted after drain (got $NEW, want a non-200 refusal)"; exit 1
          fi

          echo "=== Heartbeat timeout: kill -9 unblocks an in-flight request with a retryable error ==="
          # The drained worker has exited; bring a fresh one back.
          ./atlas worker \
            --join ws://127.0.0.1:9090/workers/connect --token "$ATLAS_JOIN_TOKEN" \
            --model "$CONF_MODEL_NAME" --model "$CONF_REASONING_NAME" > atlas-worker2.log 2>&1 &
          echo $! > worker.pid
          for _ in $(seq 1 150); do
            curl -sf -o /dev/null "$API/readyz" && break
            sleep 2
          done
          if ! curl -sf -o /dev/null "$API/readyz"; then
            echo "::error::worker did not rejoin for the timeout scenario"; cat atlas-worker2.log; exit 1
          fi
          # Start a buffered request, let it reach the worker, then hard-kill it.
          # The request must return a retryable 5xx within the heartbeat timeout
          # (~30 s), not hang until the client deadline.
          ( curl -sS -m 90 -o /tmp/to_body.txt -w '%{http_code}' \
              -H "x-api-key: $ATLAS_API_KEY" -H 'content-type: application/json' \
              "$API/v1/messages" -d "$(payload 512 'Write a long detailed essay about distributed systems.')" \
              > /tmp/to_code.txt ) &
          TO_PID=$!
          sleep 3
          start=$(date +%s)
          kill -9 "$(cat worker.pid)"
          wait "$TO_PID" || true
          elapsed=$(( $(date +%s) - start ))
          CODE=$(cat /tmp/to_code.txt)
          echo "in-flight request after kill -9 → HTTP $CODE in ${elapsed}s"
          if [ -z "$CODE" ] || [ "$CODE" -lt 500 ]; then
            echo "::error::expected a retryable 5xx after the worker was killed, got '$CODE'"; cat /tmp/to_body.txt; exit 1
          fi
          if [ "$elapsed" -gt 60 ]; then
            echo "::error::in-flight request took ${elapsed}s to fail — should unblock within the heartbeat timeout (~30 s)"; exit 1
          fi
          echo "Fleet-ops scenarios passed."
      # Phase-4a exit criterion (G11): connection-identified routing across two
      # workers. Each worker serves a different model, so a request that reaches
      # the wrong worker would 404 — proving the gateway routes by which worker
      # holds the model, not a single name-keyed slot. Then a worker dropping must
      # not take down a model another worker still serves (the route-identity
      # review finding). The fleet-ops step left its worker killed, so this starts
      # fresh single-model workers.
      - name: G11 multi-worker routing
        run: |
          set -uo pipefail
          API=http://127.0.0.1:9090
          ask() { # $1=model -> echoes HTTP status of a small request
            curl -sS -m 60 -o /dev/null -w '%{http_code}' \
              -H "x-api-key: $ATLAS_API_KEY" -H 'content-type: application/json' \
              "$API/v1/messages" \
              -d "$(printf '{"model":"%s","max_tokens":16,"messages":[{"role":"user","content":"hi"}]}' "$1")" || true
          }

          # Worker A serves only model A; worker B serves only model B.
          ./atlas worker --join ws://127.0.0.1:9090/workers/connect --token "$ATLAS_JOIN_TOKEN" \
            --model "$CONF_MODEL_NAME" > g11-a.log 2>&1 &
          echo $! > wa.pid
          ./atlas worker --join ws://127.0.0.1:9090/workers/connect --token "$ATLAS_JOIN_TOKEN" \
            --model "$CONF_REASONING_NAME" > g11-b.log 2>&1 &
          echo $! > wb.pid

          # Both models must answer 200 — each can only be served by its own worker.
          for _ in $(seq 1 150); do
            [ "$(ask "$CONF_MODEL_NAME")" = "200" ] && [ "$(ask "$CONF_REASONING_NAME")" = "200" ] && break
            sleep 2
          done
          A=$(ask "$CONF_MODEL_NAME"); B=$(ask "$CONF_REASONING_NAME")
          echo "model A ($CONF_MODEL_NAME) → $A ; model B ($CONF_REASONING_NAME) → $B"
          if [ "$A" != "200" ] || [ "$B" != "200" ]; then
            echo "::error::both workers' models did not become routable (A=$A B=$B)"
            echo "=== worker A ==="; cat g11-a.log; echo "=== worker B ==="; cat g11-b.log; exit 1
          fi

          echo "=== Worker B leaves: model A keeps serving, model B becomes unavailable ==="
          kill -TERM "$(cat wb.pid)"
          for _ in $(seq 1 20); do if [ "$(ask "$CONF_REASONING_NAME")" = "200" ]; then sleep 1; else break; fi; done
          A2=$(ask "$CONF_MODEL_NAME"); B2=$(ask "$CONF_REASONING_NAME")
          echo "after B leaves: model A → $A2 ; model B → $B2"
          if [ "$A2" != "200" ]; then
            echo "::error::model A stopped serving when worker B left — routing was not worker-scoped (got $A2)"; exit 1
          fi
          if [ "$B2" = "200" ]; then
            echo "::error::model B still answered 200 after its only worker left (got $B2)"; exit 1
          fi

          echo "=== Same-model overlap: a second worker for model A survives the first leaving ==="
          ./atlas worker --join ws://127.0.0.1:9090/workers/connect --token "$ATLAS_JOIN_TOKEN" \
            --model "$CONF_MODEL_NAME" > g11-a2.log 2>&1 &
          echo $! > wa2.pid
          # Let the second model-A worker join and register a second instance.
          for _ in $(seq 1 150); do [ "$(ask "$CONF_MODEL_NAME")" = "200" ] && break; sleep 2; done
          kill -TERM "$(cat wa.pid)" # drop the first model-A worker
          sleep 5
          A3=$(ask "$CONF_MODEL_NAME")
          echo "after the first model-A worker leaves: model A → $A3"
          if [ "$A3" != "200" ]; then
            echo "::error::model A dropped when one of two workers serving it left (got $A3)"
            echo "=== worker A2 ==="; cat g11-a2.log; exit 1
          fi
          echo "G11 multi-worker routing passed."
      # Phase-4b-1: scheduler-driven remote loading. A bare worker (no --model)
      # joins; `atlas deploy` makes the server command it to load a model over the
      # channel; once it reports ready the gateway routes to it; `atlas stop`
      # unloads it. Proves the load/unload protocol and placement end to end on a
      # real engine.
      - name: Remote deploy (scheduler load/unload)
        run: |
          set -uo pipefail
          API=http://127.0.0.1:9090
          ask() { # $1=model -> echoes HTTP status of a small request
            curl -sS -m 60 -o /dev/null -w '%{http_code}' \
              -H "x-api-key: $ATLAS_API_KEY" -H 'content-type: application/json' \
              "$API/v1/messages" \
              -d "$(printf '{"model":"%s","max_tokens":16,"messages":[{"role":"user","content":"hi"}]}' "$1")" || true
          }

          # A bare worker: it provisions the engine but serves nothing until the
          # scheduler places a model on it.
          ./atlas worker --join ws://127.0.0.1:9090/workers/connect --token "$ATLAS_JOIN_TOKEN" \
            > deploy-worker.log 2>&1 &
          echo $! > wd.pid
          sleep 3 # let it join

          echo "=== deploy $CONF_REASONING_NAME onto the fleet ==="
          if ! ./atlas deploy "$CONF_REASONING_NAME" --server "$API"; then
            echo "::error::atlas deploy failed"; cat deploy-worker.log; exit 1
          fi
          for _ in $(seq 1 150); do [ "$(ask "$CONF_REASONING_NAME")" = "200" ] && break; sleep 2; done
          CODE=$(ask "$CONF_REASONING_NAME")
          echo "deployed model → $CODE"
          if [ "$CODE" != "200" ]; then
            echo "::error::deployed model never became routable (got $CODE)"; cat deploy-worker.log; exit 1
          fi

          echo "=== stop the deployment ==="
          if ! ./atlas stop "$CONF_REASONING_NAME" --server "$API"; then
            echo "::error::atlas stop failed"; exit 1
          fi
          for _ in $(seq 1 20); do if [ "$(ask "$CONF_REASONING_NAME")" = "200" ]; then sleep 1; else break; fi; done
          GONE=$(ask "$CONF_REASONING_NAME")
          echo "after stop → $GONE"
          if [ "$GONE" = "200" ]; then
            echo "::error::model still served after atlas stop (got $GONE)"; exit 1
          fi
          echo "Remote deploy scenario passed."
      # Phase-4b-2: auto-start on first request. A dedicated control plane with
      # auto-start enabled (the shared server above runs with --autostart-timeout 0
      # to keep G11/Remote-deploy deterministic). A bare worker joins serving
      # nothing; a client request for a catalog model the server does not yet serve
      # must auto-deploy it onto the worker and answer once it loads — no
      # `atlas deploy`. (Idle-stop is covered by unit tests; a real idle wait is
      # impractical end to end.)
      - name: Auto-start on first request
        run: |
          set -uo pipefail
          API=http://127.0.0.1:9091
          ./atlas server --addr 127.0.0.1:9091 --autostart-timeout 120s \
            --token "$ATLAS_JOIN_TOKEN" > as-server.log 2>&1 &
          echo $! > as-server.pid
          sleep 2
          # Bare worker (no --model): provisions the engine, serves nothing yet.
          ./atlas worker --join ws://127.0.0.1:9091/workers/connect --token "$ATLAS_JOIN_TOKEN" \
            > as-worker.log 2>&1 &
          echo $! > as-worker.pid
          sleep 3 # let it join

          ask() { # $1=model -> echoes HTTP status of a small request
            curl -sS -m 60 -o /dev/null -w '%{http_code}' \
              -H "x-api-key: $ATLAS_API_KEY" -H 'content-type: application/json' \
              "$API/v1/messages" \
              -d "$(printf '{"model":"%s","max_tokens":16,"messages":[{"role":"user","content":"hi"}]}' "$1")" || true
          }

          echo "=== request $CONF_REASONING_NAME with no deployment (auto-start) ==="
          # No `atlas deploy`: the request itself must bring the model online. The
          # first call kicks off the load; poll until it is ready (cold load can
          # outlast one request's 60s timeout, but the load continues server-side).
          for _ in $(seq 1 150); do [ "$(ask "$CONF_REASONING_NAME")" = "200" ] && break; sleep 2; done
          CODE=$(ask "$CONF_REASONING_NAME")
          echo "auto-started model → $CODE"
          if [ "$CODE" != "200" ]; then
            echo "::error::model did not auto-start on first request (got $CODE)"; cat as-worker.log; exit 1
          fi
          # It now shows up as a scheduler-owned deployment (/admin/* needs the key).
          echo "deployments: $(curl -sS -H "x-api-key: $ATLAS_API_KEY" "$API/admin/deployments")"
          echo "Auto-start scenario passed."
      - name: Stop Atlas
        if: always()
        run: |
          for p in worker.pid wa.pid wb.pid wa2.pid wd.pid as-worker.pid; do kill "$(cat $p 2>/dev/null)" 2>/dev/null || true; done
          for p in server.pid as-server.pid; do kill "$(cat $p 2>/dev/null)" 2>/dev/null || true; done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: conformance-fleet-matrix
          path: conformance/results/matrix.json

  docs:
    name: Docs lint
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v5
      # Same tools the pre-commit hook runs; versions pinned so CI does not
      # drift from what contributors see locally.
      - run: npx --yes prettier@3.8.4 --check "**/*.md"
      - run: npx --yes markdownlint-cli2@0.22.1 "**/*.md"
