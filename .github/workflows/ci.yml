name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: Lint
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false # golangci-lint-action manages its own cache
      - name: Check go.mod is tidy
        run: go mod tidy -diff
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2 # keep in sync with local installs (brew install golangci-lint)

  test:
    name: Test
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...

  release-dry-run:
    name: Release dry-run
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # goreleaser derives the version from git history
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --snapshot --clean

  conformance:
    name: Conformance (stub gateway)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v8.2.0 # no floating major tag — pin exact
        with:
          enable-cache: true
          cache-dependency-glob: conformance/uv.lock
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: conformance/ts/package-lock.json
      - run: npm ci --no-fund --no-audit
        working-directory: conformance/ts
      # Gate: G1 green against the stub. Failures in other groups are the
      # point at this phase — matrix.json records what isn't conformant yet,
      # and the gate widens as m0-build-plan phases land.
      - name: Run harness
        run: uv run --locked python run.py --require G1
        working-directory: conformance
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: conformance-matrix
          path: conformance/results/matrix.json

  docs:
    name: Docs lint
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v5
      # Same tools the pre-commit hook runs; versions pinned so CI does not
      # drift from what contributors see locally.
      - run: npx --yes prettier@3.8.4 --check "**/*.md"
      - run: npx --yes markdownlint-cli2@0.22.1 "**/*.md"
