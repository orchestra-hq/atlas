name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: Lint
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false # golangci-lint-action manages its own cache
      - name: Check go.mod is tidy
        run: go mod tidy -diff
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2 # keep in sync with local installs (brew install golangci-lint)

  test:
    name: Test
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...

  release-dry-run:
    name: Release dry-run
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # goreleaser derives the version from git history
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --snapshot --clean

  conformance:
    name: Conformance (llama.cpp)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      # Conformance-tier models, resolved from the starter catalog (phase 9):
      # tiny enough to run on a CPU runner, capable enough to pass the structural
      # G-group tasks at temperature 0. The non-reasoning model carries G1–G3 +
      # the G4 graceful-no-op case; the reasoning model (Qwen3, hybrid thinking)
      # carries the G4 thinking cases. Both are gguf catalog entries, so CI
      # exercises the cold-boot path: `atlas pull` → store → `atlas up`.
      CONF_MODEL_NAME: qwen2.5-1.5b-instruct
      CONF_REASONING_NAME: qwen3-0.6b
      ATLAS_STATE_DIR: ${{ github.workspace }}/.atlas-state
      ATLAS_API_KEY: conformance-ci-key
      # Where atlas writes its request log; G10 reads it to assert per-request
      # token counts are logged. Absolute so the harness (run from conformance/)
      # and the Start Atlas step (run from the workspace root) agree.
      ATLAS_LOG_FILE: ${{ github.workspace }}/atlas.log
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@v8.2.0 # no floating major tag — pin exact
        with:
          enable-cache: true
          cache-dependency-glob: conformance/uv.lock
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: conformance/ts/package-lock.json
      - run: npm ci --no-fund --no-audit
        working-directory: conformance/ts
      - name: Build atlas
        run: go build -o atlas ./cmd/atlas
      # The store is content-addressed by the catalog's pinned sha256, so cache
      # it keyed on the catalog file; only the first run pays the download.
      - name: Cache model store
        uses: actions/cache@v4
        with:
          path: ${{ env.ATLAS_STATE_DIR }}/store
          key: conf-store-${{ hashFiles('catalog/starter.yaml') }}
      # Phase-9 cold-boot proof: pull the catalog models into the store (verified
      # against their pinned digests), then boot from it. A no-op on a cache hit.
      - name: Pull catalog models
        run: ./atlas pull "$CONF_MODEL_NAME" "$CONF_REASONING_NAME"
      # atlas provisions the pinned llama.cpp runtime into the state dir on
      # first run; cache it keyed on the pinned tag (keep in sync with
      # internal/runtime.LlamaCppTag).
      - name: Cache llama.cpp runtime
        uses: actions/cache@v4
        with:
          path: ${{ env.ATLAS_STATE_DIR }}/runtimes
          key: llamacpp-runtime-${{ runner.os }}-${{ runner.arch }}-b9611
      - name: Start Atlas
        run: |
          ./atlas up \
            --model "$CONF_MODEL_NAME" \
            --model "$CONF_REASONING_NAME" \
            --alias "claude-sonnet-4-6=${CONF_MODEL_NAME}" \
            --alias "claude-haiku-4-5=${CONF_MODEL_NAME}" \
            --alias "claude-opus-4-1=${CONF_REASONING_NAME}" \
            --addr 127.0.0.1:8080 --api-key "$ATLAS_API_KEY" > "$ATLAS_LOG_FILE" 2>&1 &
          echo $! > atlas.pid
          # Readiness, not just liveness: wait until a model can actually answer.
          for _ in $(seq 1 150); do
            curl -sf -o /dev/null http://127.0.0.1:8080/readyz && break
            sleep 2
          done
          if ! curl -sf -o /dev/null http://127.0.0.1:8080/readyz; then
            echo "::error::Atlas did not become ready"; cat "$ATLAS_LOG_FILE"; exit 1
          fi
      # Gate: G1-G10 green on the real gateway — the full M0 surface on the
      # llama.cpp CPU tier: messages, streaming, tools, thinking, models+aliases,
      # count_tokens, Anthropic-shaped errors (incl. pre-dispatch context-window
      # rejection), the OpenAI /v1/chat/completions surface, the ops minimum
      # (/healthz, /readyz, token counts in logs), and G9 (agent harness). G9's
      # agent-sdk cell drives a >=3-call streamed tool loop through Atlas; its
      # real-Claude-Code drop-in cell is opt-in (CONF_CLAUDE_CODE_SMOKE) — the
      # 1.5B CPU-tier model drives Claude Code only intermittently, so that cell
      # and the vLLM full matrix are the capable/GPU acceptance tier (M0 "done"
      # is gated on that run; see docs/open-questions.md), not the per-PR CPU gate.
      - name: Run harness
        run: |
          uv run --locked python run.py \
            --base-url http://127.0.0.1:8080 \
            --engine llamacpp --model "$CONF_MODEL_NAME" \
            --reasoning-model "$CONF_REASONING_NAME" \
            --require G1,G2,G3,G4,G5,G6,G7,G8,G9,G10
        working-directory: conformance
      - name: Stop Atlas
        if: always()
        run: kill "$(cat atlas.pid)" 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: conformance-matrix
          path: conformance/results/matrix.json

  docs:
    name: Docs lint
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v5
      # Same tools the pre-commit hook runs; versions pinned so CI does not
      # drift from what contributors see locally.
      - run: npx --yes prettier@3.8.4 --check "**/*.md"
      - run: npx --yes markdownlint-cli2@0.22.1 "**/*.md"
