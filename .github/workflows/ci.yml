name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: Lint
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false # golangci-lint-action manages its own cache
      - name: Check go.mod is tidy
        run: go mod tidy -diff
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2 # keep in sync with local installs (brew install golangci-lint)

  test:
    name: Test
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...

  release-dry-run:
    name: Release dry-run
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # goreleaser derives the version from git history
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --snapshot --clean

  conformance:
    name: Conformance (llama.cpp)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      # Conformance-tier model: tiny enough to run on a CPU runner, capable
      # enough to pass the structural G-group tasks at temperature 0.
      CONF_MODEL_FILE: qwen2.5-1.5b-instruct-q4_k_m.gguf
      CONF_MODEL_URL: https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf
      CONF_MODEL_NAME: qwen2.5-1.5b-instruct-q4_k_m
      ATLAS_STATE_DIR: ${{ github.workspace }}/.atlas-state
      ATLAS_API_KEY: conformance-ci-key
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@v8.2.0 # no floating major tag — pin exact
        with:
          enable-cache: true
          cache-dependency-glob: conformance/uv.lock
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: conformance/ts/package-lock.json
      - run: npm ci --no-fund --no-audit
        working-directory: conformance/ts
      - name: Build atlas
        run: go build -o atlas ./cmd/atlas
      # The model is deterministic by filename; cache it so only the first run
      # pays the download.
      - name: Cache conformance model
        id: model
        uses: actions/cache@v4
        with:
          path: models
          key: conf-model-${{ env.CONF_MODEL_FILE }}
      - name: Download model
        if: steps.model.outputs.cache-hit != 'true'
        run: |
          mkdir -p models
          curl -sSL -o "models/${CONF_MODEL_FILE}" "$CONF_MODEL_URL"
      # atlas provisions the pinned llama.cpp runtime into the state dir on
      # first run; cache it keyed on the pinned tag (keep in sync with
      # internal/runtime.LlamaCppTag).
      - name: Cache llama.cpp runtime
        uses: actions/cache@v4
        with:
          path: ${{ env.ATLAS_STATE_DIR }}/runtimes
          key: llamacpp-runtime-${{ runner.os }}-${{ runner.arch }}-b9611
      - name: Start Atlas
        run: |
          ./atlas up --model "models/${CONF_MODEL_FILE}" \
            --addr 127.0.0.1:8080 --api-key "$ATLAS_API_KEY" > atlas.log 2>&1 &
          echo $! > atlas.pid
          for _ in $(seq 1 150); do
            curl -sf -o /dev/null http://127.0.0.1:8080/healthz && break
            sleep 2
          done
          if ! curl -sf -o /dev/null http://127.0.0.1:8080/healthz; then
            echo "::error::Atlas did not become ready"; cat atlas.log; exit 1
          fi
      # Gate: G1 (non-streaming) green on the real gateway — the phase-2 exit
      # criterion. Other groups fail by design; matrix.json records what isn't
      # conformant yet, and the gate widens as m0-build-plan phases land.
      - name: Run harness
        run: |
          uv run --locked python run.py \
            --base-url http://127.0.0.1:8080 \
            --engine llamacpp --model "$CONF_MODEL_NAME" \
            --require G1
        working-directory: conformance
      - name: Stop Atlas
        if: always()
        run: kill "$(cat atlas.pid)" 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: conformance-matrix
          path: conformance/results/matrix.json

  docs:
    name: Docs lint
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v5
      # Same tools the pre-commit hook runs; versions pinned so CI does not
      # drift from what contributors see locally.
      - run: npx --yes prettier@3.8.4 --check "**/*.md"
      - run: npx --yes markdownlint-cli2@0.22.1 "**/*.md"
