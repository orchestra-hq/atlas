name: Docs site

# Build the Astro Starlight docs site on every PR that touches it (machinery proven
# per-PR), and on main publish website/dist to the `gh-pages` branch. We deploy via a
# branch (Pages Source: "Deploy from a branch" → gh-pages /) rather than the GitHub
# Actions Pages flow on purpose: a branch is plain git and does NOT consume the
# org-wide Actions artifact storage quota, which the actions/upload-pages-artifact
# path kept hitting. See docs/internal/m5-build-plan.md.

on:
  push:
    branches: [main]
    paths: ["website/**", ".github/workflows/docs-site.yml"]
  pull_request:
    paths: ["website/**", ".github/workflows/docs-site.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    working-directory: website

jobs:
  build:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write # push the built site to the gh-pages branch (main only)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      # `astro build` runs the starlight-links-validator plugin, so a broken
      # internal link fails the build — this is the per-PR link check.
      - run: npm run build
      # On main (push or manual run), publish the built site to the gh-pages branch.
      # Plain git force-push — no Actions artifact, so the storage quota never applies.
      # `.nojekyll` stops Pages' Jekyll from dropping Astro's `_astro/` asset dir.
      - name: Publish to gh-pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          touch dist/.nojekyll
          cd dist
          git init -q
          git checkout -q -b gh-pages
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              add -A
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -qm "deploy docs site @ ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
