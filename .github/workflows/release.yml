name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub release + upload artifacts
  id-token: write # cosign keyless signing via GitHub OIDC (M4)

jobs:
  release:
    name: GoReleaser
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history for the changelog
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # cosign for the keyless signing step in .goreleaser.yaml.
      - uses: sigstore/cosign-installer@v3.7.0
      # Short-lived token for the Homebrew-tap push, minted from the dedicated
      # "Atlas Release" GitHub App (Contents:write on orchestra-hq/homebrew-tap
      # only) — never a PAT. Scoped to just the tap repo. The release itself uses
      # the default GITHUB_TOKEN below; only the brews push uses this one.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: tap-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: orchestra-hq
          repositories: homebrew-tap
      - uses: goreleaser/goreleaser-action@v6
        with:
          # Pinned: .goreleaser.yaml uses the `brews` (formula) stanza, which a
          # floating "~> v2" could drop (it is deprecated in favor of casks — but
          # a formula is the right artifact for an un-notarized CLI: no macOS
          # Gatekeeper quarantine). Bump deliberately. Keep in sync with the
          # ci.yml dry-run.
          version: "2.16.0"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ steps.tap-token.outputs.token }}
